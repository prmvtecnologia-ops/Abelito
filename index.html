<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>

<script>
'use strict';
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=960,H=540,GR=0.5,GROUND=510;

const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);

/* ================= ENTRADA ================= */
const K={},pressed={};
function press(k){if(!K[k])pressed[k]=1;K[k]=1;}
function release(k){K[k]=0;}
function clearPressed(){for(const k in pressed)delete pressed[k];}
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',Space:'up',ArrowDown:'down',KeyS:'down',KeyX:'kick',KeyJ:'kick',KeyZ:'kick',KeyC:'slide',KeyK:'slide',ShiftLeft:'slide',ShiftRight:'slide',Enter:'ok',NumpadEnter:'ok',Digit1:'n1',Digit2:'n2',Digit3:'n3',Numpad1:'n1',Numpad2:'n2',Numpad3:'n3',KeyP:'pause',Escape:'pause'};
addEventListener('keydown',e=>{if(adminOpen)return;if(e.target&&e.target.tagName==='INPUT')return;const k=KEYMAP[e.code];if(k){e.preventDefault();if(!e.repeat)press(k);initAudio();}});
addEventListener('keyup',e=>{if(e.target&&e.target.tagName==='INPUT')return;const k=KEYMAP[e.code];if(k)release(k);});
addEventListener('blur',()=>{for(const k in K)K[k]=0;});
let click=null;
C.addEventListener('pointerdown',e=>{if(nameOpen||adminOpen)return;initAudio();const r=C.getBoundingClientRect();click={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};press('ok');setTimeout(()=>release('ok'),60);});
const coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;

const isTouch=coarse||('ontouchstart' in window)||(navigator.maxTouchPoints>0);
const TBS=[...document.querySelectorAll('.tb')];let held=new Set();
function touchKeys(e){
  const now=new Set();
  for(const t of e.touches){for(const b of TBS){const r=b.getBoundingClientRect(),pad=10;
    if(t.clientX>=r.left-pad&&t.clientX<=r.right+pad&&t.clientY>=r.top-pad&&t.clientY<=r.bottom+pad){now.add(b.dataset.k);break;}}}
  for(const k of now)if(!held.has(k)){press(k);}
  for(const k of held)if(!now.has(k))release(k);
  held=now;TBS.forEach(b=>b.classList.toggle('on',now.has(b.dataset.k)));
}
['touchstart','touchmove','touchend','touchcancel'].forEach(ev=>document.addEventListener(ev,e=>{
  if(nameOpen||adminOpen)return;
  const onBtn=[...e.changedTouches].some(t=>{const el=document.elementFromPoint(t.clientX,t.clientY);return el&&el.classList&&el.classList.contains('tb');})||held.size>0;
  if(ev==='touchstart')initAudio();
  touchKeys(e);
  if(onBtn&&e.cancelable)e.preventDefault();
},{passive:false}));
TBS.forEach(b=>{b.addEventListener('mousedown',e=>{e.preventDefault();initAudio();press(b.dataset.k);});b.addEventListener('mouseup',()=>release(b.dataset.k));b.addEventListener('mouseleave',()=>release(b.dataset.k));});
const pauseBtn=document.getElementById('pauseBtn');
pauseBtn.addEventListener('click',e=>{e.preventDefault();press('pause');setTimeout(()=>release('pause'),60);});
let rotDismissed=false;
document.getElementById('rotOk').addEventListener('click',()=>{rotDismissed=true;layout();});
function layout(){
  const portrait=innerHeight>innerWidth;
  document.body.classList.toggle('portrait',isTouch&&portrait);
  document.getElementById('touch').style.display=isTouch?'flex':'none';
  pauseBtn.style.display=isTouch?'flex':'none';
  document.getElementById('rotate').style.display=(isTouch&&portrait&&!rotDismissed)?'flex':'none';
  let aw=innerWidth,ah=innerHeight;
  if(isTouch&&portrait)ah=Math.max(160,innerHeight-210);
  const sc=Math.min(aw/W,ah/H);C.style.width=Math.floor(W*sc)+'px';C.style.height=Math.floor(H*sc)+'px';
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));layout();

/* ================= SOM ================= */
let AC=null;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
function snd(f,d,type,v,slide){if(!AC)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v||0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}}
function jingle(notes,step){notes.forEach((n,i)=>setTimeout(()=>snd(n,0.18,'square',0.05),i*(step||110)));}

/* ================= CENÁRIO ================= */
const PLAT=[
  {x:-200,y:GROUND,w:W+400,ground:1,dir:-1},
  {x:0,y:410,w:820,dir:1},
  {x:140,y:310,w:820,dir:-1},
  {x:0,y:210,w:820,dir:1},
  {x:60,y:115,w:400,dir:1,top:1},
];

/* ================= VISUAL DOS PERSONAGENS ================= */
const LOOK={
  abel:{hair:'#2a2a2a',coat:'#1c1c1f',tie:'#0a8f3c',shorts:'#1c1c1f',socks:'#1c1c1f',beard:'#3b3b3b',skin:'#e6b48c'},
  abelWin:{hair:'#2a2a2a',coat:'#1c1c1f',tie:'#0a8f3c',shorts:'#1c1c1f',socks:'#1c1c1f',beard:'#3b3b3b',skin:'#e6b48c',armsUp:1},
  gremio:{shirt:['#1f7fd4','#111'],vst:1,shorts:'#111',socks:'#fff'},
  spfc:{shirt:['#fafafa'],band:['#e1251b','#111'],shorts:'#fafafa',socks:'#fafafa'},
  corinthians:{shirt:['#fafafa'],collar:'#111',shorts:'#111',socks:'#fafafa'},
  flamengo:{shirt:['#d0021b','#111'],hst:1,shorts:'#fafafa',socks:'#111'},
  rionato:{coat:'#1f5fae',tie:'#fafafa',hair:'#d8d8d8',shades:1,shorts:'#1f2a44',socks:'#1f2a44',skin:'#e9b896'},
  ceninha:{shirt:['#ff7a00'],gloves:'#ffe14d',shorts:'#111',socks:'#ff7a00',hair:'#6b4a2b',skin:'#e0a982'},
  numdeupai:{coat:'#111',tie:'#fafafa',hair:'#eeeeee',mustache:'#eeeeee',shorts:'#111',socks:'#111',skin:'#e9b896'},
  maure:{shirt:['#d0021b','#111'],hst:1,hair:'#2b1b0f',mouth:1,shorts:'#fafafa',socks:'#111',armsUp:1,skin:'#d9a07a'},
  ref:{shirt:['#f4d000'],collar:'#111',shorts:'#111',socks:'#111',hair:'#333',skin:'#e0a982'},
  gominho:{shirt:['#0a8f3c'],collar:'#fff',shorts:'#fafafa',socks:'#0a8f3c',hair:'#1b1b1b',skin:'#a86f4c'},
  fraquinho:{shirt:['#0a8f3c'],collar:'#fff',shorts:'#fafafa',socks:'#0a8f3c',hair:'#6b4a2b',longhair:1,skin:'#e6b48c'},
  giarce:{shirt:['#0a8f3c'],collar:'#fff',shorts:'#fafafa',socks:'#0a8f3c',hair:'#111',beard:'#111',skin:'#d9a07a'},
};
const SKINS=['#f1c7a0','#e0a982','#c68a62','#a86f4c','#7a4b2e'];
const HAIRS=['#111','#2b1b0f','#5a3a1e','#1b1b1b','#c9a24a'];

function drawGuy(x,y,f,s,o,a){
  a=a||{};const u=2*s;f=f<0?-1:1;
  ctx.save();
  if(a.slide){ctx.translate(x,y);ctx.rotate(-f*1.2);ctx.translate(-x,-y);}
  const X=(dx,ww)=>f>0?x+dx:x-dx-ww;
  const B=(dx,top,ww,hh,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(X(dx*u,ww*u)),Math.round(y-top*u),Math.ceil(ww*u),Math.ceil(hh*u));};
  const sk=o.skin||a.skin||'#e0a982',hair=o.hair||a.hair||'#222';
  const shirt=o.shirt||[o.coat||'#333'],armC=o.coat||shirt[0];
  const w=a.walk||0,lb=Math.max(0,Math.sin(w))*1.2,lf=Math.max(0,-Math.sin(w))*1.2;
  const legC=o.socks||'#fff';
  // perna de trás
  B(-3,6+lb,2.5,5,legC);B(-3.4,1+lb,3.3,1.2,'#111');
  // braço de trás
  if(o.armsUp){B(-6.5,21,1.6,6.5,armC);B(-6.5,22.3,1.6,1.4,o.gloves||sk);}
  else{B(-6,14.5,1.6,5,armC);B(-6,9.8,1.6,1.4,o.gloves||sk);}
  // calção
  B(-4,9,8,3,o.shorts||'#111');
  // perna da frente
  if(a.kick){B(1,8,6.5,2.2,legC);B(7,8.4,2,2.8,'#111');}
  else{B(0.5,6+lf,2.5,5,legC);B(0.5,1+lf,3.4,1.2,'#111');}
  // tronco
  if(o.coat){B(-5,15,10,6.2,o.coat);B(-0.8,15,2.4,4.2,'#fff');B(0,14.7,0.9,4.4,o.tie||'#111');}
  else if(o.vst){for(let i=0;i<5;i++)B(-5+2*i,15,2,6.2,shirt[i%2]);}
  else if(o.hst){for(let j=0;j<3;j++)B(-5,15-2*j,10,2.1,shirt[j%2]);}
  else{B(-5,15,10,6.2,shirt[0]);}
  if(o.band){B(-5,13,10,1,o.band[0]);B(-5,12,10,1,o.band[1]);}
  if(o.collar)B(-2,15,4,0.9,o.collar);
  // braço da frente
  if(o.armsUp){B(4.9,21,1.6,6.5,armC);B(4.9,22.3,1.6,1.4,o.gloves||sk);}
  else if(o.gloves){B(4.5,14.5,1.6,4,armC);B(4,11.5,3.2,3.2,o.gloves);}
  else{const sw=a.kick?-1:Math.sin(w)*0.8;B(4.5,14.5+sw,1.6,5,armC);B(4.5,9.8+sw,1.6,1.4,sk);}
  // cabeça
  if(o.longhair)B(-3.6,21.5,2.6,7.5,hair);
  B(-3,21,6,6,sk);
  B(-3.3,21.6,6.6,1.9,hair);B(-3.3,21,1.5,3.5,hair);
  if(o.shades)B(0.2,19.3,3.2,1.3,'#111');else B(1.6,19.2,1,1.3,'#111');
  if(o.beard)B(-1,17,4.3,2,o.beard);
  if(o.mustache)B(0.4,17.7,3,0.9,o.mustache);
  if(o.mouth)B(1.4,17.2,1.8,1.6,(Math.floor(Date.now()/150)%2)?'#5a0000':'#a00');
  ctx.restore();
}

function drawMic(x,y,rot,big,gold){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);const s=big?1.5:1;
  ctx.fillStyle='#1d1d1d';ctx.fillRect(-2*s,0,4*s,13*s);
  ctx.fillStyle='#e33';ctx.fillRect(-3*s,1*s,6*s,3*s);
  ctx.fillStyle=gold?'#ffd23f':'#c9c9c9';ctx.beginPath();ctx.arc(0,-3*s,6*s,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-5*s,-4*s,10*s,1*s);ctx.fillRect(-5*s,-1.5*s,10*s,1*s);
  ctx.restore();
}
function drawBall(x,y,r,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#222';ctx.lineWidth=Math.max(1.5,r/8);ctx.stroke();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(0,0,r*0.33,0,Math.PI*2);ctx.fill();
  for(let i=0;i<5;i++){const an=i*Math.PI*2/5;ctx.beginPath();ctx.arc(Math.cos(an)*r*0.78,Math.sin(an)*r*0.78,r*0.17,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}
function T(s,x,y,sz,col,al,sh){
  ctx.font=sz+"px 'Press Start 2P', monospace";ctx.textAlign=al||'center';ctx.textBaseline='alphabetic';
  if(sh!==null){ctx.fillStyle=sh||'#000';const o=Math.max(2,Math.round(sz/7));ctx.fillText(s,x+o,y+o);}
  ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);
}
const MAXL=8;
function redCard(x,y,on){ctx.fillStyle=on?'#111':'#222';ctx.fillRect(x+1,y+1,12,17);ctx.fillStyle=on?'#e3182d':'#3a3a3a';ctx.fillRect(x,y,12,17);if(on){ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x+2,y+2,3,6);}}
function heart(x,y,on){const P=[[1,0],[2,0],[4,0],[5,0],[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[1,3],[2,3],[3,3],[4,3],[5,3],[2,4],[3,4],[4,4],[3,5]];ctx.fillStyle=on?'#ff3b5c':'#3a3a3a';for(const[a,b]of P)ctx.fillRect(x+a*3,y+b*3,3,3);}

/* ================= FASES ================= */
const PH=[
 {team:'GRÊMIO',look:'gremio',boss:'rionato',bossName:'RIONATO MIGUXO',ehp:1,esp:1.3,sky:['#081a33','#1d4f8c'],crowd:['#1f7fd4','#111','#fafafa','#0a8f3c'],

  else if(pressed.ok||pressed.kick||pressed.up)pick_=chooseSel;
  if(pick_>=0){chooseSel=pick_;const A=ALLIES[pick_];ally={who:pick_,x:player.x-36,y:player.y,t:0,f:1,walk:0,slideT:0,kickT:0};poof(ally.x,ally.y-20);jingle([523,659,784],90);
    state='play';say([...PH[3].taunt,{who:A.name,look:A.look,text:A.line}],spawnBoss);}
}
function update(){
  frame++;
  const showAd=amOwner&&state==='title'&&!adminOpen;if(showAd!==adBtnShown){adBtnShown=showAd;ad.btn.style.display=showAd?'block':'none';}
  if(adminOpen){clearPressed();click=null;return;}
  if(pressed.pause&&state==='play')paused=!paused;
  if(paused){clearPressed();click=null;return;}
  const ok=pressed.ok||pressed.up||pressed.kick;
  switch(state){
    case 'title':if(ok)startGame();break;
    case 'dialog':updDialog(ok);break;
    case 'choose':updChoose(ok);break;
    case 'play':updPlay();break;
    case 'win':case 'lose':
      stageT++;updParts();
      if(state==='win'&&frame%3===0)parts.push({x:rnd(0,W),y:-10,vx:rnd(-1,1),vy:rnd(1,3),g:0.02,t:300,col:pick(['#0a8f3c','#fff','#ffd23f','#3ecf5a']),sz:rnd(4,8)});
      if(state==='lose'&&frame%10===0)parts.push({x:rnd(0,W),y:-20,vx:0,vy:rnd(2,4),g:0.05,t:260,mic:1,rot:rnd(0,6)});
      if(stageT===50&&!rankShown&&!nameOpen){if(score>0)openNameBox();else rankShown=true;}
      if(ok&&stageT>60&&rankShown&&!nameOpen){if(state==='win')state='title';else startGame();}
      break;
  }
  clearPressed();click=null;
}

/* ================= DESENHO ================= */
function drawWorld(){
  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake)*0.5,rnd(-shake,shake)*0.5);
  ctx.drawImage(bg(phase),0,0);
  for(const b of balls)drawBall(b.x,b.y-9,9,b.rot);
  for(const s of eshots){
    if(s.kind==='ball')drawBall(s.x,s.y,s.r,s.rot);
    else if(s.kind==='card'){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.fillStyle='#f4d000';ctx.fillRect(-6,-8,12,16);ctx.strokeStyle='#111';ctx.lineWidth=1.5;ctx.strokeRect(-6,-8,12,16);ctx.restore();}
    else if(s.kind==='bla'){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(s.x,s.y,s.r+10,s.r,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d0021b';ctx.lineWidth=2;ctx.stroke();T('BLÁ',s.x,s.y+4,9,'#d0021b','center',null);}
  }
  const lk=LOOK[PH[phase].look];
  for(const e of enemies){if(e.flash>0&&frame%4<2)continue;drawGuy(e.x,e.y,e.f,1,lk,{walk:e.walk,skin:e.skin,hair:e.hair});}
  for(const r of refs){if(!r.alive||(r.flash>0&&frame%4<2))continue;drawGuy(r.x,r.y,r.f,1,LOOK.ref,{walk:r.walk});
    if(r.whistle>0){ctx.fillStyle='#ccc';ctx.fillRect(r.x+r.f*8-2,r.y-36,5,3);T('PRIII!',r.x,r.y-50,8,'#f4d000');}}
  if(boss)drawBoss();
  if(ally){const A=ALLIES[ally.who];drawGuy(ally.x,ally.y,ally.f,1,LOOK[A.look],{walk:ally.walk,kick:ally.kickT>0,slide:ally.slideT>0});T(A.name,ally.x,ally.y-50,7,'#9fe8b0');}
  const P=player;
  if(P&&!(P.inv>0&&Math.floor(P.inv/4)%2&&P.slideT<=0))drawGuy(P.x,P.y,P.f,1,LOOK.abel,{walk:P.onGround?P.walk:1.2,kick:P.kickT>0,slide:P.slideT>0});
  for(const m of mics){
    if(m.slide){ctx.fillStyle='rgba(62,207,90,.75)';ctx.beginPath();ctx.ellipse(m.x,m.y+4,26,9,0,0,Math.PI*2);ctx.fill();T('CARRINHO!',m.x,m.y-12,8,'#fff');for(let k=0;k<3;k++)parts.push({x:m.x-Math.sign(m.vx)*20,y:m.y+6,vx:-m.vx*0.2,vy:rnd(-2,0),g:0.1,t:14,col:pick(['#3ecf5a','#8b5a2b']),sz:3});}
    else{ctx.globalAlpha=m.harmless?0.6:1;drawMic(m.x,m.y,m.rot,m.big,m.gold);ctx.globalAlpha=1;}
  }
  for(const p of parts){if(p.mic)continue;ctx.fillStyle=p.col;ctx.globalAlpha=clamp(p.t/25,0,1);ctx.fillRect(p.x,p.y,p.sz,p.sz);}
  ctx.globalAlpha=1;
  for(const t of texts){ctx.globalAlpha=clamp(t.t/20,0,1);T(t.s,t.x,t.y,10,t.col);}
  ctx.globalAlpha=1;
  ctx.restore();
  drawHUD();
}
function drawBoss(){
  const b=boss;if(b.flash>0&&frame%4<2&&!b.dead)return;
  ctx.save();
  if(b.dead){ctx.globalAlpha=Math.max(0,1-stageT/110);}
  const s=1.8;
  if(b.type==='numdeupai'){
    if(b.state==='ground')drawBall(b.ballX,GROUND-30,30,b.t*0.02);
    else drawBall(b.x,b.y+30,30,b.t*0.1*b.dir);
    drawGuy(b.x,b.y,b.state==='ground'?b.f:(boss.dir||1),s,LOOK.numdeupai,{walk:b.walk});
    if(b.state==='air'&&b.t%90<45)T('NUM DESÇO!',b.x,b.y-90,9,'#fff');
  }else{
    drawGuy(b.x,b.y,b.f,s,LOOK[b.type],{walk:b.walk});
    if(b.type==='ceninha'){ctx.fillStyle='rgba(255,225,77,.35)';ctx.fillRect(b.f>0?b.x+18:b.x-24,b.y-80,6,80);
      if(b.turn>0){T('?!',b.x,b.y-90,12,'#ffd23f');}}
    if(b.type==='maure'&&b.t%120<50)T(['ABSURDO!','ÁRBITRO!','ROUBADO!'][Math.floor(b.t/120)%3],b.x,b.y-92,10,'#fff');
  }
  ctx.restore();
}
function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,34);
  T('FASE '+(phase+1)+' · '+PH[phase].team,12,22,11,'#fff','left');
  for(let i=0;i<MAXL;i++)redCard(240+i*17,8,i<lives);
  if(stage==='enemies'||stage==='bossIntro')T('ADVERSÁRIOS '+Math.min(killed,11)+'/11',395,22,10,'#ffd23f','left');
  const pw=[['PULO 2X','pulo'],['CHUTE X2','potente'],['CARRINHO','carrinho']];
  pw.forEach(([n,k],i)=>{const x=620+i*96;ctx.fillStyle=powers[k]?'#0a8f3c':'#2a2a2a';ctx.fillRect(x,7,90,20);T(n,x+45,22,7,powers[k]?'#fff':'#666','center',null);});
  T(String(score).padStart(6,'0'),W-12,48,10,'#fff','right');
  if(boss&&(stage==='boss'||stage==='bossDead')){
    const bw=360,bx=W/2-bw/2,by=44;ctx.fillStyle='#000';ctx.fillRect(bx-3,by-3,bw+6,18);ctx.fillStyle='#401010';ctx.fillRect(bx,by,bw,12);
    ctx.fillStyle='#ff3b3b';ctx.fillRect(bx,by,bw*boss.hp/boss.max,12);T(PH[phase].bossName,W/2,by+30,10,'#fff');
    if(boss.type==='maure'&&refs.some(r=>r.alive))T('PROTEGIDO PELO APITO (½ DANO)',W/2,by+46,8,'#f4d000');
  }
  if(state==='play'&&stage==='enemies'&&stageT<600&&frame%50<38){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(W/2-250,474,500,30);
    T(isTouch?'BOTÃO CHUTE = CHUTAR MICROFONE':'APERTE X (OU CLIQUE) PARA CHUTAR MICROFONE',W/2,495,10,'#ffd23f','center',null);}
  if(paused){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);T('PAUSADO',W/2,H/2,28,'#ffd23f');T(isTouch?'Toque em II para continuar':'Aperte P para continuar',W/2,H/2+40,10,'#fff');}
}
function wrap(text,maxW){
  const words=text.split(' '),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;
}
function drawDialog(){
  const d=dlg,L=d.lines[d.i];
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,H);
  const bx=30,by=H-178,bw=W-60,bh=160;
  ctx.fillStyle='#f8f8f0';ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='#202830';ctx.lineWidth=6;ctx.strokeRect(bx+3,by+3,bw-6,bh-6);
  ctx.strokeStyle='#4a9a6a';ctx.lineWidth=2;ctx.strokeRect(bx+11,by+11,bw-22,bh-22);
  let tx=bx+30;
  if(L.look){ctx.fillStyle='#cfe8d6';ctx.fillRect(bx+20,by+18,118,124);ctx.strokeStyle='#202830';ctx.lineWidth=3;ctx.strokeRect(bx+20,by+18,118,124);
    ctx.save();ctx.beginPath();ctx.rect(bx+20,by+18,118,124);ctx.clip();drawGuy(bx+79,by+150,1,2.6,LOOK[L.look],{});ctx.restore();tx=bx+158;}
  ctx.font="12px 'Press Start 2P', monospace";const nw=ctx.measureText(L.who).width+28;
  ctx.fillStyle='#202830';ctx.fillRect(bx+18,by-26,nw,30);T(L.who,bx+32,by-6,12,'#ffd23f','left',null);
  ctx.font="13px 'Press Start 2P', monospace";
  const lines=wrap(L.text,bx+bw-tx-30);let left=Math.floor(d.ch);
  lines.forEach((ln,i)=>{if(left<=0)return;const s=ln.slice(0,left);left-=ln.length+1;T(s,tx,by+42+i*24,13,'#202830','left',null);});
  if(d.ch>=L.text.length&&frame%40<24){ctx.fillStyle='#d0021b';const ax=bx+bw-34,ay=by+bh-30;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax+14,ay);ctx.lineTo(ax+7,ay+9);ctx.fill();}
}
function drawChoose(){
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
  T('A FINAL CONTRA O MAURECLAMÃO!',W/2,62,16,'#ffd23f');T('ESCOLHA UM PARCEIRO PARA TE AJUDAR',W/2,92,11,'#fff');
  for(let i=0;i<3;i++){const r=cardRect(i),A=ALLIES[i],sel=i===chooseSel;
    ctx.fillStyle=sel?'#14532d':'#1b1f24';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle=sel?'#ffd23f':'#555';ctx.lineWidth=sel?5:2;ctx.strokeRect(r.x,r.y,r.w,r.h);
    drawGuy(r.x+r.w/2,r.y+170,1,3.2,LOOK[A.look],{walk:sel?frame*0.15:0});
    T(A.name,r.x+r.w/2,r.y+205,14,'#fff');A.desc.forEach((t,k)=>T(t,r.x+r.w/2,r.y+240+k*20,9,'#9fe8b0','center',null));
    T('['+(i+1)+']',r.x+r.w/2,r.y+r.h-14,10,sel?'#ffd23f':'#888','center',null);}
  T('◀ ▶ para escolher · ENTER/toque para confirmar',W/2,H-40,10,'#ccc','center',null);
}
function drawTitle(){
  ctx.drawImage(bg(0),0,0);ctx.fillStyle='rgba(4,30,14,.72)';ctx.fillRect(0,0,W,H);
  T('ABELITO',W/2,120,52,'#3ecf5a','center','#062');
  T('E A LIBERTADORES DO MICROFONE',W/2,165,16,'#ffd23f');
  const t=frame;drawGuy(130,330,1,2.2,LOOK.abel,{kick:t%60<14,walk:0});
  for(let k=0;k<4;k++){const x=170+((t*4+k*90)%380);drawMic(x,290+Math.sin((t+k*20)*0.1)*6,t*0.3,false,k===2);}
  T('4 FASES · 4 CHEFÕES · 1 TAÇA',320,385,11,'#fff');
  drawRanking(600,192,330,200);
  const ctr=isTouch?['CHUTE (OU TOQUE NA TELA) = CHUTAR MICROFONE','◀ ▶ ANDAR   PULO = PULAR   ▼ DESCER   CARR. = CARRINHO']:['X (OU CLIQUE NA TELA) = CHUTAR MICROFONE   ← → ANDAR   ↑/ESPAÇO PULAR','↓ DESCER DA PLATAFORMA   C CARRINHO   P PAUSAR'];
  ctr.forEach((s,i)=>T(s,W/2,420+i*22,9,'#cfe8d6','center',null));
  if(frame%60<40)T(isTouch?'TOQUE NA TELA PARA COMEÇAR':'APERTE ENTER OU TOQUE PARA COMEÇAR',W/2,488,13,'#fff');
  
}
function drawEnd(){
  const isWin=state==='win';
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,isWin?'#063d1c':'#2a0000');gr.addColorStop(1,isWin?'#0a8f3c':'#5a0010');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  for(const p of parts){if(p.mic){drawMic(p.x,p.y,p.rot+frame*0.05,false,false);}else{ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.sz,p.sz);}}
  if(isWin){
    const cx=W/2,cy=250;ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(cx-60,cy-80);ctx.lineTo(cx+60,cy-80);ctx.quadraticCurveTo(cx+60,cy,cx,cy+10);ctx.quadraticCurveTo(cx-60,cy,cx-60,cy-80);ctx.fill();
    ctx.fillRect(cx-10,cy+5,20,36);ctx.fillRect(cx-40,cy+40,80,14);ctx.fillStyle='#b8860b';ctx.fillRect(cx-46,cy+54,92,10);
    ctx.strokeStyle='#ffd23f';ctx.lineWidth=8;ctx.beginPath();ctx.arc(cx-62,cy-50,20,Math.PI*0.5,Math.PI*1.5);ctx.stroke();ctx.beginPath();ctx.arc(cx+62,cy-50,20,-Math.PI*0.5,Math.PI*0.5);ctx.stroke();
    drawMic(cx,cy-40,0,true,true);
    drawGuy(cx-170,330,1,2,LOOK.abelWin,{});
    T('CAMPEÃO DA',W/2,70,22,'#fff');T('LIBERTADORES DO MICROFONE!',W/2,110,22,'#ffd23f');
    T('PONTUAÇÃO '+score+'   RECORDE '+best,W/2,400,12,'#fff');
    
  }else{
    const sw=Math.sin(frame*0.08)*0.12;ctx.save();ctx.translate(W/2,150);ctx.rotate(sw);
    ctx.fillStyle='#000';ctx.fillRect(-42,-58,90,124);ctx.fillStyle='#e3182d';ctx.fillRect(-46,-62,90,124);ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(-38,-54,16,40);ctx.restore();
    drawGuy(W/2+110,240,-1,1.4,LOOK.ref,{});
    T('EXPULSO!',W/2,290,44,'#ff3b5c');
    T('VOCÊS DA MÍDIA VENCERAM!',W/2,335,14,'#fff');
    T('...mas o Abelito vai voltar do início!',W/2,368,10,'#ffd23f');
    
  }
}
function draw(){
  ctx.imageSmoothingEnabled=false;
  if((state==='win'||state==='lose')&&rankShown){drawEnd();ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    T(state==='win'?'CAMPEÃO DA LIBERTADORES DO MICROFONE!':'EXPULSO! VOCÊS DA MÍDIA VENCERAM!',W/2,58,state==='win'?14:15,state==='win'?'#ffd23f':'#ff3b5c');
    drawRanking(W/2-230,86,460,250);
    if(rankNote)T(rankNote,W/2,360,8,'#ffd23f','center',null);
    T('SUA PONTUAÇÃO: '+score,W/2,395,12,'#fff');
    if(frame%60<40)T(state==='win'?'ENTER OU TOQUE PARA VOLTAR AO MENU':'ENTER OU TOQUE PARA RECOMEÇAR DO INÍCIO',W/2,450,11,'#cfe8d6');
    return;}
  if(state==='title')drawTitle();
  else if(state==='win'||state==='lose')drawEnd();
  else{drawWorld();if(state==='dialog'&&dlg)drawDialog();if(state==='choose')drawChoose();}
}
let last=performance.now(),acc=0;const STEP=1000/60;
function loop(now){acc+=Math.min(200,now-last);last=now;while(acc>=STEP){update();acc-=STEP;}draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
